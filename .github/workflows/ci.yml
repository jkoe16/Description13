# 올릴 때마다(그리고 PR마다) 화면을 빌드하고 시험을 돌린다. 시험: npm test
name: 빌드·시험
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
